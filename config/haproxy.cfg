global
    daemon
    maxconn 16384
    # nbthread auto (let HAProxy pick based on available CPUs)
    tune.ssl.default-dh-param 2048
    tune.bufsize 65536
    tune.maxrewrite 8192
    tune.h2.initial-window-size 262144
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    # log global
    # option httplog
    option dontlognull
    option http-keep-alive
    option tcp-smart-connect
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout http-request 10s
    timeout tunnel 1h

frontend fe_main
    bind *:80
    bind *:443 ssl crt /etc/vps-data/haproxy.pem alpn h2,http/1.1

    http-request deny deny_status 404 unless { path_beg /vmess } or { path_beg /vless } or { path_beg /vmess-grpc } or { path_beg /vless-grpc } or { path_beg /vmess-hu } or { path_beg /vless-hu }

    acl is_vmess path_beg /vmess
    acl is_vless path_beg /vless
    acl is_vmess_grpc path_beg /vmess-grpc
    acl is_vless_grpc path_beg /vless-grpc
    acl is_vmess_hu path_beg /vmess-hu
    acl is_vless_hu path_beg /vless-hu

    use_backend be_vmess_grpc if is_vmess_grpc
    use_backend be_vless_grpc if is_vless_grpc
    use_backend be_vmess_hu if is_vmess_hu
    use_backend be_vless_hu if is_vless_hu
    use_backend be_vmess if is_vmess
    use_backend be_vless if is_vless

backend be_vmess
    server xray_vmess 127.0.0.1:7001

backend be_vless
    server xray_vless 127.0.0.1:7002

backend be_vmess_grpc
    server xray_vmess_grpc 127.0.0.1:7003 proto h2

backend be_vless_grpc
    server xray_vless_grpc 127.0.0.1:7004 proto h2

backend be_vmess_hu
    server xray_vmess_hu 127.0.0.1:7005

backend be_vless_hu
    server xray_vless_hu 127.0.0.1:7006
